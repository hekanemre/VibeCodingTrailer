name: Set Default Branch to Master

on:
  push:
    branches:
      - initial
  workflow_dispatch:

permissions:
  administration: write

jobs:
  set-default-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Set master as default branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // Verify the master branch exists before changing the default branch
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: 'heads/master'
              });
            } catch (error) {
              core.setFailed(`Branch 'master' does not exist in ${owner}/${repo}. Cannot set it as default.`);
              return;
            }

            await github.rest.repos.update({
              owner,
              repo,
              default_branch: 'master'
            });
            console.log('Default branch successfully changed to master');
